name: Deploy scroll-experience to GitHub Pages

# Deploys the scroll-driven Three.js section as the site root, straight from
# this feature branch (no merge to the default branch required).
on:
  push:
    branches: ["claude/wizardly-mccarthy-0k5xr7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to turn Pages on automatically (build type: GitHub Actions).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the scroll experience, so the site root IS the page.
          path: scroll-experience

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
